services:
  livecity:
    build: .
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:8000
      DB_PATH: /data/livecity.db
      SOURCE_POLL_SECONDS: 300
      INCIDENT_TTL_MINUTES: 360
      RADAR_API_TOKEN: ${RADAR_API_TOKEN:-}
      POWER_ARCGIS_LAYER_URL: ${POWER_ARCGIS_LAYER_URL:-}
      WATER_ARCGIS_LAYER_URL: ${WATER_ARCGIS_LAYER_URL:-}
      OPENCELLID_API_KEY: ${OPENCELLID_API_KEY:-}
    volumes:
      - livecity_data:/data

volumes:
  livecity_data:
